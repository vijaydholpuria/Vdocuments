<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>Admin Login — V Doc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/style.css">
<style>
  .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; position: relative; }
  .login-wrap::before {
    content: ""; position: absolute; top: -10%; left: 50%; transform: translateX(-50%);
    width: 800px; height: 500px; border-radius: 50%;
    background: radial-gradient(circle, rgba(37,99,235,0.18), transparent 70%); z-index: -1;
  }
  .login-card { width: 100%; max-width: 408px; padding: 42px 38px; animation: fadeInUp .5s ease both; }
  .login-lock-icon {
    width: 56px; height: 56px; border-radius: 16px; margin: 0 auto 20px;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff;
    box-shadow: 0 10px 22px -8px rgba(37, 99, 235, 0.55);
  }
  .login-brand { display: flex; align-items: center; gap: 9px; justify-content: center; margin-bottom: 28px; font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; color: var(--text-muted); }
  .login-brand .logo-mark { width: 26px; height: 26px; border-radius: 7px; font-size: 0.7rem; }
  .login-card h2 { text-align: center; font-size: 1.5rem; margin-bottom: 8px; }
  .login-card > p.sub { text-align: center; color: var(--text-muted); font-size: .88rem; margin-bottom: 30px; line-height: 1.5; }
  .login-card form .form-group:last-of-type { margin-bottom: 26px; }
  .password-field { position: relative; }
  .password-field .form-control { padding-right: 44px; }
  .password-toggle { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); display: flex; }
  .back-home { display: block; text-align: center; margin-top: 24px; font-size: .85rem; color: var(--text-muted); }
  .back-home:hover { color: var(--primary); }
  .top-right-toggle { position: fixed; top: 20px; right: 20px; }
</style>
</head>
<body>

<div class="page-loader"><div class="spinner"></div><p>Loading…</p></div>

<button class="icon-btn top-right-toggle" data-theme-toggle aria-label="Toggle dark mode"></button>

<div class="login-wrap">
  <div class="login-card glass">
    <div class="login-lock-icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    </div>
    <div class="login-brand"><span class="logo-mark" data-site-logo>VD</span><span data-site-name>V Doc</span></div>
    <h2>Admin sign in</h2>
    <p class="sub">Manage files, categories, and site settings.</p>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" class="form-control" placeholder="you@example.com" required autocomplete="username">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-field">
          <input type="password" id="password" class="form-control" placeholder="Enter your password" required autocomplete="current-password">
          <button type="button" class="password-toggle" id="togglePw" aria-label="Show password">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="loginBtn">Sign In</button>
    </form>

    <a href="./index.html" class="back-home">← Back to file library</a>
  </div>
</div>

    <div class="footer-social">
